name: Test & Publish Docker Image

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: sugoi13/sugoibot

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Check if version changed in package.json
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Fetch remote tags to verify if this tag already exists
          git fetch --tags || true

          if git rev-parse "v${VERSION}" >/dev/null 2>&1 || git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists. Skipping build and push."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if previous commit exists and compare package.json version
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -e "let data=''; process.stdin.on('data', d => data += d); process.stdin.on('end', () => { try { console.log(JSON.parse(data).version); } catch(e) { console.log(''); } })" || echo "")
            if [ "$VERSION" != "$PREV_VERSION" ]; then
              echo "Version changed from '$PREV_VERSION' to '$VERSION'."
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version has not changed ($VERSION). Skipping build and push."
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous commit found in history; treating version as changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: test
    if: needs.test.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Git Tag and Release with Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.test.outputs.version }}"
          echo "Creating Git Tag and GitHub Release for v${VERSION}..."
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Set up QEMU (for multi-architecture emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.test.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
