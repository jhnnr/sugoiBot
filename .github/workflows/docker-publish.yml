name: Test & Publish Docker Image

on:
  push:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

env:
  IMAGE_NAME: sugoi13/sugoibot

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
      release_type: ${{ steps.check_version.outputs.release_type }}
      docker_tag: ${{ steps.check_version.outputs.docker_tag }}
      include_latest: ${{ steps.check_version.outputs.include_latest }}
      create_github_release: ${{ steps.check_version.outputs.create_github_release }}
      github_release_tag: ${{ steps.check_version.outputs.github_release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Check if version changed in package.json
        id: check_version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch --tags --force || true
          node scripts/release-version.js

  build-and-push:
    name: Build & Push Multi-Arch Image
    needs: test
    if: needs.test.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Git Tag and Release with Changelog
        if: needs.test.outputs.create_github_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating Git Tag and GitHub Release for ${{ needs.test.outputs.github_release_tag }}..."
          gh release create "${{ needs.test.outputs.github_release_tag }}" \
            --title "${{ needs.test.outputs.github_release_tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"

      - name: Set up QEMU (for multi-architecture emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.test.outputs.include_latest == 'true' }}
            type=raw,value=${{ needs.test.outputs.docker_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
