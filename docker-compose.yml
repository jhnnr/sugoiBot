services:
  sugoibot:
    image: sugoi13/sugoibot:latest
    container_name: sugoibot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./data:/app/data
    networks:
      - sugoibot
networks:
  sugoibot:
    driver: bridge